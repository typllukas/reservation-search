services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                UID: '${HOST_UID:-1000}'
                GID: '${HOST_GID:-1000}'
        user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
        volumes:
            - .:/app
        healthcheck:
            test: ['CMD-SHELL', 'php -r "exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);"']
            interval: 5s
            timeout: 5s
            retries: 10
        depends_on:
            mariadb:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '127.0.0.1:${APP_PORT:-8081}:80'
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/app/public:ro
        depends_on:
            php:
                condition: service_healthy

    mariadb:
        image: mariadb:11.4
        # the image default is 128 MB, too little to compare fairly with the 1 GB Elasticsearch heap
        command: --innodb-buffer-pool-size=2G
        environment:
            MARIADB_ROOT_PASSWORD: '${DB_PASSWORD:-root}'
            MARIADB_DATABASE: '${DB_NAME:-reservations}'
        ports:
            - '127.0.0.1:${DB_PORT:-3308}:3306'
        volumes:
            - mariadb-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 20

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
        environment:
            discovery.type: single-node
            # on, Kibana would need a service-account token only a running cluster can issue
            xpack.security.enabled: 'false'
            ES_JAVA_OPTS: '-Xms1g -Xmx1g'
        ports:
            # security is off, 0.0.0.0 would expose the cluster
            - '127.0.0.1:${ELASTICSEARCH_PORT:-9201}:9200'
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
        healthcheck:
            test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
            interval: 5s
            timeout: 5s
            retries: 30

    kibana:
        # Dev Tools only
        image: docker.elastic.co/kibana/kibana:9.1.0
        environment:
            ELASTICSEARCH_HOSTS: http://elasticsearch:9200
        ports:
            - '127.0.0.1:${KIBANA_PORT:-5602}:5601'
        depends_on:
            elasticsearch:
                condition: service_healthy

volumes:
    mariadb-data:
    elasticsearch-data:
